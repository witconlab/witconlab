<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광산자치아고라 ③ 우선 과제 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --us: #16a34a; --us-bg: #dcfce7; --ext: #2563eb; --ext-bg: #dbeafe; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
  header { padding: 24px 18px 18px; background: linear-gradient(135deg, #15803d, #0d9488 50%, #1d4ed8); color: #fff; }
  header small { font-size: 15px; font-weight: 700; opacity: .9; }
  header h1 { font-size: 26px; font-weight: 900; margin-top: 6px; line-height: 1.3; }
  header p { font-size: 16px; margin-top: 8px; opacity: .95; line-height: 1.5; }
  main { padding: 14px; max-width: 600px; margin: 0 auto; }
  .tbar { display: flex; align-items: center; gap: 10px; margin: 6px 2px 4px; }
  .tbar b { font-size: 22px; font-weight: 900; }
  .tbar span { color: var(--muted); font-weight: 700; }
  .tbar button { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; margin: 20px 2px 10px; }
  h2 small { font-size: 14px; font-weight: 700; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt .no { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; background: #f1f5f9; }
  .opt span { flex: 1; }
  .opt b { display: block; font-size: 19px; line-height: 1.35; }
  .opt em { display: block; font-style: normal; font-size: 15px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .opt .r { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #cbd5e1; }
  .us .opt.on { border-color: var(--us); background: var(--us-bg); } .us .opt.on .r { border: 8px solid var(--us); }
  .ext .opt.on { border-color: var(--ext); background: var(--ext-bg); } .ext .opt.on .r { border: 8px solid var(--ext); }
  .us .opt.on .no { background: var(--us); color: #fff; } .ext .opt.on .no { background: var(--ext); color: #fff; }
  .none { color: var(--muted); font-size: 15px; padding: 6px 2px; }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tables h3 { grid-column: 1 / -1; font-size: 16px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .tables h3 i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
  .tables button { border: 2px solid var(--line); border-left: 8px solid var(--c); background: #fff; border-radius: 14px; padding: 16px; font: inherit; font-size: 20px; font-weight: 900; text-align: left; }
  .submit { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(248, 250, 252, .96); border-top: 1px solid var(--line); }
  .submit button { display: block; width: 100%; max-width: 600px; margin: 0 auto; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-size: 19px; font-weight: 900; color: #fff; background: #0f172a; }
  .submit button:disabled { background: #cbd5e1; }
  .submit p { text-align: center; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .state { text-align: center; padding: 60px 16px; }
  .state .big { font-size: 56px; }
  .state h2 { justify-content: center; margin-top: 12px; }
  .state p { color: var(--muted); margin-top: 8px; line-height: 1.6; font-size: 17px; }
  .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #0f172a; color: #fff; font-weight: 700; padding: 12px 18px; border-radius: 12px; font-size: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  /* 테이블 퍼실용: 눈에 띄지 않게 맨 아래 작은 글씨 */
  .tbar button[data-done] { font-size: 12px; padding: 6px 10px; color: #94a3b8; }
  .fac { margin: 40px 2px 0; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
  .fac .link { border: 0; background: none; font: inherit; font-size: 13px; color: #94a3b8; text-decoration: underline; padding: 6px; }
  .fac .ok { font-size: 14px; color: #15803d; font-weight: 700; margin: 0 0 8px; }
  .fac .res-btn { width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-size: 17px; font-weight: 900; color: #fff; background: #0f172a; }
  .res { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 10px; }
  .res h3 { font-size: 17px; margin: 10px 0 6px; }
  .res .row { display: grid; grid-template-columns: 26px 1fr 34px; gap: 8px; align-items: center; font-size: 15px; margin: 6px 0; }
  .res .row i { font-style: normal; font-weight: 900; color: var(--muted); }
  .res .row span { line-height: 1.3; }
  .res .row span u { display: block; text-decoration: none; height: 8px; border-radius: 4px; margin-top: 3px; background: #e2e8f0; overflow: hidden; }
  .res .row span u s { display: block; height: 100%; background: #94a3b8; }
  .res .row.top { font-weight: 900; } .res .us .row.top u s { background: var(--us); } .res .ext .row.top u s { background: var(--ext); }
  .res .row em { font-style: normal; font-weight: 900; text-align: right; }
  .res .note { font-size: 14px; color: #b45309; font-weight: 700; margin-top: 2px; }
  .res .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  /* ⑤ 퍼실 결과 확인 */
  .five .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .five .card h3 { font-size: 18px; margin-bottom: 6px; } .five .card h3 small { font-size: 13px; color: var(--muted); font-weight: 700; }
  .five .card.ai { border: 2px solid #a855f7; background: #faf5ff; }
  .five dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 15px; line-height: 1.45; }
  .five dt { color: var(--muted); font-weight: 800; font-size: 13px; padding-top: 2px; }
  .five .btns { display: grid; gap: 8px; margin-top: 14px; }
  .five .btns button { border: 0; border-radius: 12px; padding: 14px; font: inherit; font-size: 17px; font-weight: 900; color: #fff; background: #0f172a; }
  .five .btns button.ai { background: #7c3aed; } .five .btns button.ok { background: #16a34a; } .five .btns button.light { background: #f1f5f9; color: var(--muted); font-size: 14px; padding: 10px; }
  .five .btns button:disabled { opacity: .5; }
  .five .done { background: #dcfce7; color: #166534; font-weight: 900; border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 16px; }
  .five .hint { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .toast.on { opacity: 1; } .toast.err { background: #b91c1c; }
</style>
</head>
<body>
<header>
  <small>2026 광산자치아고라 · ③ 우선 과제 선정</small>
  <h1>우리 테이블이 먼저 할 일을 골라 주세요</h1>
  <p>🟢 주민이 할 일 1개, 🔵 기관 도움이 필요한 일 1개.<br>투표는 한 번만 할 수 있어요.</p>
</header>
<main id="main"><div class="state"><p>불러오는 중…</p></div></main>
<div class="submit" id="submit" hidden><button id="send">투표하기</button><p id="sub-msg"></p></div>
<div class="toast" id="toast"></div>

<script src="config.js?v=20261119m"></script>
<script src="assets/app.js?v=20261119m"></script>
<script>
(function () {
  const A = window.Agora;
  const { TOPICS, TOPIC_ORDER, esc } = A;
  const $ = s => document.querySelector(s);
  let my = A.LS.get('agora-my-tvote', {});          // {round, table, us, ext, sent}
  let pick = { us: my.us || '', ext: my.ext || '' };
  // 테이블 QR(tvote.html?t=5)로 들어오면 그 테이블로 바로
  const qt = Number(new URLSearchParams(location.search).get('t'));
  if (qt >= 1 && qt <= A.TABLE_COUNT && qt !== my.table) { my = { round: my.round, table: qt }; pick = { us: '', ext: '' }; A.LS.set('agora-my-tvote', my); }
  let lastKey = '', res = null;
  let five = { items: null, summary: null, busy: '' };   // ⑤ 퍼실 결과 확인
  const F_LBL = { bg: '현황·배경', want: '바라는 모습', prop: '우리의 제안', first: '첫걸음', with: '함께할 이웃' };
  const propHtml = (ps, cls, title) => '<div class="card ' + cls + '"><h3>' + title + '</h3>' + (ps.length ? ps.map(p => '<p style="font-weight:900;margin:8px 0 4px">★ ' + esc(p.title || '') + '</p><dl>' +
    Object.keys(F_LBL).map(f => '<dt>' + F_LBL[f] + '</dt><dd>' + esc(p[f] || '추후 협의') + '</dd>').join('') + '</dl>').join('') : '<p class="hint">④에 정리된 내용이 아직 없어요.</p>') + '</div>';
  function fiveHtml(no) {
    if (!five.items) return '<div class="btns"><button data-five="load">📄 우리 테이블 제안서 불러오기</button></div>';
    const sm = five.summary || {}, cf = (sm.confirm || {})[no], st = (sm.tables || {})[no], hasAi = !!(st && st.byTable);
    const raw = A.proposals(no, five.items, null, false), ai = hasAi ? A.proposals(no, five.items, sm, false) : [];
    return (cf ? '<div class="done">✅ ' + (cf.use === 'ai' ? 'AI 문장으로' : '원문으로') + ' 확정했어요 · ' + A.hhmm(cf.at) + '</div>' : '') +
      propHtml(raw, '', '📄 기록자가 쓴 원문 <small>④ 탭 그대로</small>') + (hasAi ? propHtml(ai, 'ai', '✨ AI가 다듬은 문장 <small>원래 뜻과 같은지 확인</small>') : '') +
      '<div class="btns">' + (five.busy === 'ai' ? '<button class="ai" disabled>✨ AI가 다듬는 중… (최대 몇 분)</button>' : '<button class="ai" data-five="ai"' + (raw.length ? '' : ' disabled') + '>✨ ' + (hasAi ? 'AI로 다시 다듬기' : 'AI로 다듬기') + '</button>') +
      (hasAi ? '<button class="ok" data-five="cf-ai">✅ AI 문장으로 확정</button>' : '') +
      '<button class="ok" data-five="cf-raw"' + (raw.length ? '' : ' disabled') + '>✅ 원문으로 확정' + (hasAi ? ' (AI 문장 안 씀)' : '') + '</button>' +
      '<button class="light" data-five="load">🔄 새로고침 (기록자가 ④를 고친 뒤)</button>' + (cf ? '<button class="light" data-five="cf-cancel">확정 취소</button>' : '') + '</div>' +
      '<p class="hint">고칠 곳은 기록자가 ④ 탭에서 고친 뒤 「새로고침」. 확정하면 관제반과 앞 화면에 「✅ 퍼실 확인」이 떠요.</p>';
  }   // res: 퍼실이 불러온 투표 집계 {counts, tables, at}
  function resHtml(bt) {
    const c = res.counts || {};
    const part = (k, title) => {
      const list = (bt[k] || []).slice().sort((a, b) => (c[b.id] || 0) - (c[a.id] || 0) || a.no - b.no);
      const top = list.length ? (c[list[0].id] || 0) : 0, max = Math.max(1, top), tied = list.filter(o => (c[o.id] || 0) === top).length;
      return '<div class="' + k + '"><h3>' + title + '</h3>' + (list.map(o => { const n = c[o.id] || 0; return '<div class="row' + (n && n === top ? ' top' : '') + '"><i>' + o.no + '</i><span>' + esc(o.text) + '<u><s style="width:' + (n / max * 100) + '%"></s></u></span><em>' + n + '표</em></div>'; }).join('') || '<p class="none">제안 없음</p>') +
        (!list.length ? '' : !top ? '<p class="note">표 없음 → 테이블에서 정해 기록자가 직접 적어요</p>' : tied > 1 ? '<p class="note">동점 → 테이블에서 정해 기록자가 직접 적어요</p>' : '') + '</div>';
    };
    return '<div class="res">' + part('us', '🟢 주민이 직접 할 일') + part('ext', '🔵 기관 도움이 필요한 일') +
      '<p class="meta">테이블 ' + my.table + ' · ' + ((res.tables || {})[my.table] || 0) + '명 투표 · ' + res.at + ' 기준</p></div>';
  }

  function toast(msg, err) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = 'toast'; }, 2200);
  }
  const save = () => A.LS.set('agora-my-tvote', my);

  function render() {
    const st = A.state;
    if ((st.voteRound || 0) !== (my.round || 0)) { my = { round: st.voteRound || 0, table: my.table }; pick = { us: '', ext: '' }; res = null; save(); }
    const ballot = st.ballot || {};
    const bt = my.table && ballot[my.table];
    const key = [st.voteOpen, JSON.stringify(ballot), my.table, pick.us, pick.ext, my.sent, my.done, JSON.stringify(res)].join('|');
    // 테이블 퍼실 전용(작은 글씨): 투표 완료 알림 → 알린 휴대폰에서만 우리 테이블 결과 보기
    const fac = () => {
      if (!bt || (!st.voteOpen && !my.done)) return '';
      if (!my.done) return '<div class="fac"><button class="link" data-done="1">테이블 퍼실용 · 우리 테이블 투표 완료 알리기</button></div>';
      return '<div class="fac"><p class="ok">✅ 테이블 ' + my.table + ' 투표 완료를 관제반에 알렸어요</p>' +
        '<button class="res-btn" data-res="1">📊 우리 테이블 투표 결과 ' + (res ? '새로고침' : '보기') + '</button>' + (res ? resHtml(bt) : '') +
        (st.voteOpen ? '<button class="link" data-done="0">잘못 눌렀어요 · 알림 취소</button>' : '') + '</div>';
    };
    const isFive = st.stage === 'talk' && (st.sub || 0) >= 3 && my.table && !st.voteOpen;
    const key2 = key + '|' + isFive + '|' + my.fac + '|' + JSON.stringify(five);
    if (key2 === lastKey) return;
    lastKey = key2;
    $('#submit').hidden = true;
    const hd = document.querySelector('header');
    hd.querySelector('small').textContent = '2026 광산자치아고라 · ' + (isFive ? '⑤ 테이블 결과 확인' : '③ 우선 과제 선정');
    hd.querySelector('h1').textContent = isFive ? '우리 테이블 결과를 함께 확인해요' : '우리 테이블이 먼저 할 일을 골라 주세요';
    hd.querySelector('p').innerHTML = isFive ? '테이블 퍼실이 원문과 AI 문장을 확인하고 확정해요.' : '🟢 주민이 할 일 1개, 🔵 기관 도움이 필요한 일 1개.<br>투표는 한 번만 할 수 있어요.';
    if (isFive) {  // ④·⑤: 퍼실이 우리 테이블 결과를 확인·AI 다듬기·확정
      const tt = A.tableByNo(my.table);
      $('#main').innerHTML = '<div class="tbar"><b>테이블 ' + my.table + '</b><span>' + TOPICS[tt.topic].name + ' · ⑤ 결과 확인</span>' + (my.fac ? '' : '<button data-fac="1">퍼실용 · 결과 확인</button>') + '</div>' +
        (my.fac ? '<div class="five">' + fiveHtml(my.table) + '</div>' : '<div class="state"><div class="big">📝</div><h2>우리 테이블 결과를 정리하는 중이에요</h2><p>테이블 퍼실이 함께 확인해요.</p></div>');
      return;
    }
    if (my.sent && bt) {  // 한 번 투표하면 끝 (다시 투표 없음)
      const name = (k, id) => { const o = (bt[k] || []).find(x => x.id === id); return o ? o.no + '. ' + esc(o.text) : '고르지 않음'; };
      $('#main').innerHTML = '<div class="state"><div class="big">🗳</div><h2>투표해 주셔서 고맙습니다</h2><p>테이블 ' + my.table + '<br>🟢 ' + name('us', my.us) + '<br>🔵 ' + name('ext', my.ext) + '</p><p>결과는 테이블 퍼실이 알려 드려요.</p></div>' + fac();
      return;
    }
    if (!st.voteOpen) {
      $('#main').innerHTML = my.sent
        ? '<div class="state"><div class="big">🗳</div><h2>투표해 주셔서 고맙습니다</h2><p>테이블 ' + my.table + '의 결과는 테이블 퍼실이 알려 드려요.</p></div>' + fac()
        : my.done && bt ? '<div class="state"><div class="big">🗳</div><h2>투표가 끝났어요</h2></div>' + fac()
        : '<div class="state"><div class="big">⏳</div>' + (my.table ? '<p><b>테이블 ' + my.table + '</b></p>' : '') + '<h2>투표 시간이 되면 여기서 바로 골라요</h2><p>이 화면을 켜 두세요. 다시 QR을 찍지 않아도<br>투표가 열리면 제안이 자동으로 나타나요.</p></div>';
      return;
    }
    if (!bt) {  // 내 테이블 고르기
      const nos = Object.keys(ballot).map(Number);
      $('#main').innerHTML = '<h2>내 테이블 번호를 눌러 주세요</h2><div class="tables">' + TOPIC_ORDER.map(c => {
        const ts = A.tables.filter(t => t.topic === c && nos.includes(t.no));
        return ts.length ? '<h3 style="--c:' + TOPICS[c].color + '"><i></i>' + TOPICS[c].name + '</h3>' + ts.map(t => '<button data-t="' + t.no + '" style="--c:' + TOPICS[c].color + '">테이블 ' + t.no + '</button>').join('') : '';
      }).join('') + '</div>' + (nos.length ? '' : '<p class="none">아직 투표할 제안이 없어요.</p>');
      return;
    }
    const t = A.tableByNo(my.table);
    const sec = (k, title, hint) => '<div class="' + k + '"><h2>' + title + ' <small>' + hint + '</small></h2><div class="list">' +
      (bt[k].map(o => '<button class="opt' + (pick[k] === o.id ? ' on' : '') + '" data-k="' + k + '" data-id="' + o.id + '"><i class="no">' + o.no + '</i><span><b>' + esc(o.text) + '</b>' + (o.sub ? '<em>' + esc(o.sub) + '</em>' : '') + '</span><i class="r"></i></button>').join('') || '<p class="none">이 테이블은 제안이 없어요</p>') + '</div></div>';
    // 퍼실은 투표하지 않으니, QR을 찍자마자 위쪽에서 바로 누를 수 있게(작은 버튼)
    $('#main').innerHTML = '<div class="tbar"><b>테이블 ' + t.no + '</b><span>' + TOPICS[t.topic].name + '</span>' + (my.done ? '' : '<button data-done="1">퍼실용 · 투표 완료 알리기</button>') + '</div>' +
      (my.done ? fac() : '') + sec('us', '🟢 주민이 직접 할 일', '하나만') + sec('ext', '🔵 기관 도움이 필요한 일', '하나만');
    $('#submit').hidden = !!my.done;  // 완료를 알린 퍼실 휴대폰엔 투표 버튼 숨김
    $('#send').disabled = !pick.us && !pick.ext;
    $('#send').textContent = '투표하기';
    $('#sub-msg').textContent = pick.us && pick.ext ? '한 번 누르면 바꿀 수 없어요' : '주민·기관 하나씩 골라 주세요';
  }

  $('#main').addEventListener('click', async e => {
    if (e.target.closest('[data-fac]')) {
      if (!confirm('테이블 퍼실만 눌러 주세요.\n우리 테이블 결과 확인 화면을 열까요?')) return;
      my.fac = true; save(); lastKey = ''; render(); return;
    }
    const fb = e.target.closest('[data-five]');
    if (fb) {
      const act = fb.dataset.five, no = my.table;
      const reload = async () => { five.items = await A.loadFeed(); five.summary = await A.loadSummary(); };
      try {
        if (act === 'load') { fb.disabled = true; await reload(); }
        if (act === 'ai') {
          if (!five.items) await reload();
          five.busy = 'ai'; lastKey = ''; render();
          const r = await A.aiTable(no, five.items); if (r && r.error) throw new Error(r.error);
          five.summary = await A.loadSummary(); toast('✨ 다듬었어요. 원래 뜻과 같은지 확인해 주세요');
        }
        if (/^cf-/.test(act)) {
          const use = act.slice(3);
          if (use !== 'cancel' && !confirm(use === 'ai' ? 'AI가 다듬은 문장으로 확정할까요?' : '기록자가 쓴 원문으로 확정할까요?')) return;
          const r = await A.confirmTable(no, use); if (r && r.error) throw new Error(r.error);
          five.summary = await A.loadSummary(); toast(use === 'cancel' ? '확정을 취소했어요' : '✅ 확정했어요. 관제반에 알림이 가요');
        }
      } catch (err) { toast(err.message || '잠시 후 다시 눌러 주세요', true); }
      five.busy = ''; lastKey = ''; render(); return;
    }
    const rb = e.target.closest('[data-res]');
    if (rb) {
      rb.disabled = true;
      try { const r = await A.loadVotes(); if (r && r.error) throw new Error(r.error); res = { counts: r.counts || {}, tables: r.tables || {}, at: A.hhmm(Date.now()) }; }
      catch (err) { toast('결과를 불러오지 못했어요. 잠시 후 다시 눌러 주세요', true); }
      lastKey = ''; render(); return;
    }
    const db = e.target.closest('[data-done]');
    if (db) {
      const done = db.dataset.done === '1';
      if (done && !confirm('테이블 퍼실만 눌러 주세요.\n테이블 ' + my.table + ' 투표가 모두 끝났다고 관제반에 알릴까요?')) return;
      db.disabled = true;
      try {
        const r = await A.voteDone(my.table, done);
        if (r && r.error) throw new Error(r.error);
        my.done = done; if (!done) res = null; save(); toast(done ? '✅ 관제반에 알렸어요' : '알림을 취소했어요');
      } catch (err) { toast(err.message || '전송 실패. 잠시 후 다시 눌러 주세요', true); }
      lastKey = ''; render(); return;
    }
    const tb = e.target.closest('[data-t]');
    if (tb) { my.table = Number(tb.dataset.t); pick = { us: '', ext: '' }; my.sent = false; save(); lastKey = ''; render(); window.scrollTo(0, 0); return; }
    const o = e.target.closest('.opt'); if (!o) return;
    pick[o.dataset.k] = pick[o.dataset.k] === o.dataset.id ? '' : o.dataset.id;
    if (navigator.vibrate) navigator.vibrate(12);
    lastKey = ''; render();
  });
  $('#send').onclick = async () => {
    const b = $('#send'); b.disabled = true;
    try {
      const r = await A.castVote({ table: my.table, us: pick.us, ext: pick.ext });
      if (r && r.error) throw new Error(r.error);
      Object.assign(my, { us: pick.us, ext: pick.ext, sent: true }); save();
      toast('🗳 투표가 전해졌어요');
    } catch (e) { toast(e.message || '전송 실패. 잠시 후 다시 눌러 주세요', true); }
    lastKey = ''; render();
  };

  A.onState(render);
  (async function loop() {
    try { await A.pullState(); } catch (e) { /* 다음 회차 */ }
    try { if (!A.tables.length || !A.tables[0].docId) await A.loadTables(); } catch (e) { /* 기본 목록 사용 */ }
    render();
    setTimeout(loop, A.MODE === 'live' ? 7000 + Math.random() * 4000 : 1500);
  })();
})();
</script>
</body>
</html>
