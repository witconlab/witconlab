<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광산자치아고라 기록 연습장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #eef1f5; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #dfe3ea; --ok: #059669; --warn: #b45309; --bad: #b91c1c; --c: #38bdf8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  header { padding: 22px 16px 16px; background: linear-gradient(135deg, #0284c7, #0d9488 50%, #db2777); color: #fff; }
  header .in { max-width: 1240px; margin: 0 auto; }
  header small { font-size: 14px; font-weight: 700; opacity: .9; }
  header h1 { font-size: 24px; font-weight: 900; margin-top: 4px; }
  header p { font-size: 15px; margin-top: 6px; opacity: .95; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 14px 16px 40px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "doc stage" "doc check"; align-items: start; gap: 16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; grid-template-areas: "doc" "stage" "check"; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0; }
  .ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 800; flex-wrap: wrap; }
  .ph .sp { flex: 1; }
  select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; font-size: 14px; font: inherit; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .doc { grid-area: doc; }
  .paper { padding: 16px 16px 24px; }
  .rules { padding-left: 20px; font-size: 14px; line-height: 1.7; color: #334155; }
  .dtabs { display: flex; gap: 2px; padding: 8px 10px 0; background: #f1f5f9; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .dtabs button { flex: none; border: 1px solid transparent; border-bottom: 0; background: none; padding: 8px 12px; border-radius: 8px 8px 0 0; font: inherit; font-size: 14px; font-weight: 800; color: var(--muted); cursor: pointer; }
  .dtabs button.go { color: #15803d; }
  .docs h3 { display: flex; align-items: center; gap: 8px; } .docs h3 i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlink { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 2px solid #e2e8f0; border-left: 8px solid var(--c); border-radius: 12px; text-decoration: none; color: inherit; background: #fff; }
  .dlink b { font-size: 18px; } .dlink span { font-size: 13px; color: var(--muted); }
  .dlink.mine { border-color: var(--c); background: #f0fdf4; } .dlink.off { opacity: .4; pointer-events: none; }
  .dtabs button.on { background: #fff; color: #0284c7; border-color: var(--line); margin-bottom: -1px; }
  td.l small { display: block; font-weight: 500; font-size: 12px; color: #6b7280; margin-top: 3px; }
  table.cols th:first-child { width: 16%; } table.cols th { width: auto; }
  table.cols td.ans textarea, table.pair td.ans textarea { min-height: 40px; }
  table.pair th:first-child { width: 24%; } table.pair th small { display: block; font-weight: 500; font-size: 11px; opacity: .8; }
  tr.band td { font-size: 14px; padding: 8px 10px; } tr.band small { color: #475569; font-size: 12px; }
  tr.band.us td, tr.g-us td.l { background: #dcfce7; } tr.band.ext td, tr.g-ext td.l { background: #dbeafe; }
  tr.exr td { color: #6b7280; font-style: italic; font-size: 13px; background: #fafafa; }
  .paper h2 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .paper .guide { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 4px; }
  .paper h3 { font-size: 16px; font-weight: 800; margin: 22px 0 8px; scroll-margin-top: 10px; }
  .paper h3 small { font-weight: 600; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  th, td { border: 1px solid #cbd5e1; padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: #1f2937; color: #fff; font-weight: 800; }
  th:nth-child(1) { width: 26%; } th:nth-child(2) { width: 30%; }
  td.l { background: #f3f4f6; font-weight: 800; }
  td.ex { color: #6b7280; font-style: italic; font-size: 13px; }
  td.ans { padding: 0; background: #fffef5; }
  td.ans textarea { display: block; width: 100%; min-height: 54px; border: 0; outline: none; resize: none; padding: 7px 8px; font: 15px/1.6 inherit; font-family: inherit; background: transparent; color: var(--text); overflow: hidden; }
  td.ans:focus-within { box-shadow: inset 0 0 0 2px #0284c7; }
  td .h { display: block; font-size: 12px; font-weight: 700; padding: 0 8px 6px; }
  td .h.warn { color: var(--warn); } td .h.bad { color: var(--bad); } td .h.ok { color: var(--ok); }
  @media (max-width: 560px) { table:not(.cols):not(.pair) th:nth-child(2), td.ex { display: none; } table:not(.cols):not(.pair) th:nth-child(1) { width: 34%; } td.l::after { content: attr(data-ex); display: block; font-weight: 500; font-style: italic; color: #6b7280; font-size: 12px; margin-top: 4px; } }

  .stage { grid-area: stage; background: #000; color: #f5f5f4; border-color: #000; position: sticky; top: 12px; }
  @media (max-width: 900px) { .stage { position: static; } }
  .stage .ph { border-color: #222; }
  .steps { display: flex; gap: 4px; }
  .steps button { border: 1px solid #333; background: #111; color: #a1a1aa; border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .steps button.on { background: #f5f5f4; color: #000; }
  .scr { padding: 14px; min-height: 340px; }
  .q { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .q small { display: block; font-size: 13px; color: #a1a1aa; font-weight: 600; margin-top: 2px; }
  .cols { display: grid; gap: 8px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); } .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  .colh { font-size: 14px; font-weight: 900; padding: 6px 8px; border-bottom: 3px solid var(--k); margin-bottom: 6px; }
  .cd { background: #171a20; border-radius: 10px; padding: 8px 10px 8px 14px; margin-bottom: 6px; position: relative; font-size: 14px; line-height: 1.4; }
  .cd::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 10px 0 0 10px; background: var(--c); }
  .cd.new { animation: pop .6s ease; box-shadow: 0 0 0 2px var(--c); }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } }
  .none { color: #6b6b74; font-size: 13px; }
  .pick { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .pick i { color: #fbbf24; font-style: normal; margin-right: 6px; }
  .kind { font-size: 11px; font-weight: 900; padding: 1px 6px; border-radius: 5px; margin-left: 6px; color: #000; }
  .kind.us { background: #34d399; } .kind.ext { background: #60a5fa; }
  dl.f5 > div { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid #222; font-size: 14px; }
  dl.f5 dt { color: var(--c); font-weight: 800; font-size: 13px; }
  dl.f5 > div.off dt { color: #6b6b74; }
  .sheet { border-top: 5px solid var(--c); background: #101216; border-radius: 12px; padding: 12px; }
  .sheet b.t { font-size: 18px; color: var(--c); }
  .done { float: right; background: #34d399; color: #000; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }

  .check { grid-area: check; }
  .missions { list-style: none; padding: 12px 14px; display: grid; gap: 8px; }
  .missions li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; }
  .missions li i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e1; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 900; color: #fff; margin-top: 1px; }
  .missions li.ok i { background: var(--ok); border-color: var(--ok); }
  .missions li.ok { color: var(--muted); }
  .score { font-size: 14px; }
  .foot { padding: 0 14px 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .foot a { color: #0284c7; font-weight: 700; }
</style>
</head>
<body>
<header><div class="in">
  <small>2026 광산자치아고라 · 기록자 연습장</small>
  <h1>표에 써 보고, 대형 화면에 어떻게 뜨는지 바로 보기</h1>
  <p>여기서 쓴 내용은 진짜 화면에 올라가지 않아요. 실제 문서처럼 단계마다 <b>탭</b>이 나뉘어 있어요. 표의 <b>오른쪽 칸</b>에 쓰면 됩니다.</p>
</div></header>

<div class="wrap">
  <section class="panel doc">
    <div class="ph">📄 연습용 기록 문서 <span class="sp"></span>
      <select id="table" aria-label="테이블"></select>
      <button class="btn" id="fill">예시로 채워 보기</button>
      <button class="btn" id="clear">모두 지우기</button>
    </div>
    <div class="dtabs" id="dtabs" role="tablist"></div>
    <div class="paper" id="paper"></div>
  </section>

  <section class="panel stage">
    <div class="ph">🖥 대형 화면에서는 <span class="sp"></span><div class="steps" id="steps"></div></div>
    <div class="scr" id="scr"></div>
  </section>

  <section class="panel check">
    <div class="ph">✅ 연습 미션 <span class="sp"></span><span class="score" id="score"></span></div>
    <ul class="missions" id="missions"></ul>
    <p class="foot">연습이 끝나면 문서 위 <b>📂 실제 문서로</b> 탭에서 내 테이블 문서를 열어 같은 방법으로 쓰면 돼요. · <a href="기록자-가이드.html">기록자 가이드</a></p>
  </section>
</div>

<script src="config.js?v=20261119t"></script>
<script src="assets/app.js?v=20261119t"></script>
<script>
(function () {
  const A = window.Agora;
  const { TEMPLATE, TOPICS, FIELDS, TASK_FIELDS, SUBSTEPS, esc } = A;
  const $ = s => document.querySelector(s);
  const saved = A.LS.get('agora-practice-v3', {});
  let cells = saved.cells || {};
  let tableNo = saved.table || Number(A.LS.get('agora-my-table', 0)) || 1;
  let step = 0, seen = new Set();
  const SLOTS = A.slotList();
  const RULES = ['<b>요약 확인</b> — 발언의 뜻이 헷갈리면 진행자를 통해 “이렇게 정리해도 될까요?”라고 확인해요.',
    '<b>동의 여부 구분</b> — 한 사람의 제안과 테이블이 함께 확인한 내용을 구분해요. 말이 없다고 동의한 것으로 보지 않아요.',
    '<b>AI 정리 검토</b> — AI가 만든 제목·요약은 원래 발언과 대조하고(⑤ 탭에 메모), 최종 내용은 참여자가 확인해요.',
    '<b>역할 확정 구분</b> — 현장에 없는 주민·기관은 ‘참여 제안’·‘협조 요청’ 대상으로 적어요.',
    '<b>기록 시간</b> — 단계가 끝날 때 진행자가 요약을 읽어 주는 동안 정리를 마무리해요.'];
  const slotsOf = (f, k = 0) => SLOTS.filter(x => x.field === f && x.task === k).map(x => x.key);
  const linesOf = (f, k = 0) => slotsOf(f, k).flatMap(key => cells[key] || []);

  $('#table').innerHTML = A.DEFAULT_TABLES.map(t => '<option value="' + t.no + '">테이블 ' + t.no + ' · ' + TOPICS[t.topic].name + '</option>').join('');
  $('#table').value = tableNo;
  $('#dtabs').innerHTML = A.TABS.map((name, i) => '<button role="tab" data-i="' + i + '">' + esc(name) + '</button>').join('') +
    '<button role="tab" data-i="docs" class="go">📂 실제 문서로</button>';
  // 실제 기록 문서 목록 (관제 시트의 테이블별 문서 링크)
  let tablesReady = A.loadTables().catch(() => {});
  const docUrl = t => t.docId ? 'https://docs.google.com/document/d/' + encodeURIComponent(t.docId) + '/edit' : '';
  async function buildDocs() {
    $('#paper').innerHTML = '<h2>실제 기록 문서로 들어가기</h2><p class="guide">연습이 끝났으면 내 테이블 번호를 누르세요. 새 탭으로 실제 문서가 열려요. 여기에 쓰는 내용은 <b>대형 화면에 올라가요.</b></p><div class="docs" id="doclist"><p class="guide">불러오는 중…</p></div>';
    await tablesReady;
    const mine = Number(A.LS.get('agora-my-table', 0));
    $('#doclist').innerHTML = A.TOPIC_ORDER.map(c => {
      const ts = A.tables.filter(t => t.topic === c);
      if (!ts.length) return '';
      return '<h3 style="--c:' + TOPICS[c].color + '"><i></i>' + esc(TOPICS[c].name) + '</h3><div class="dgrid">' + ts.map(t => {
        const url = docUrl(t);
        return '<a class="dlink' + (url ? '' : ' off') + (t.no === mine ? ' mine' : '') + '" data-no="' + t.no + '" href="' + esc(url || '#') + '" target="_blank" rel="noopener" style="--c:' + TOPICS[c].color + '"><b>테이블 ' + t.no + '</b><span>' + esc(t.dongs || TOPICS[c].name) + '</span></a>';
      }).join('') + '</div>';
    }).join('') || '<p class="guide">아직 기록 문서가 연결되지 않았어요. 관제반에 문의해 주세요.</p>';
  }
  $('#paper').addEventListener('click', e => { const a = e.target.closest('a.dlink'); if (a) A.LS.set('agora-my-table', Number(a.dataset.no)); });

  // 실제 문서처럼 지금 단계의 탭만 보여 줌
  function buildPaper() {
    if (tabIdx === 'docs') return buildDocs();
    const t = A.tableByNo(tableNo);
    const tab = A.TABS[tabIdx];
    document.querySelectorAll('#dtabs button').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === tabIdx));
    $('#paper').innerHTML = '<h2>테이블 ' + t.no + ' · ' + TOPICS[t.topic].name + ' 기록지</h2>' +
      '<p class="guide">✍️ 맨 오른쪽 「우리 테이블 답」 칸에 써요. 칸 안에서 엔터를 치면 화면 카드가 한 장 더 생겨요. 이름·전화번호는 쓰지 않아요.</p>' +
      (tabIdx === 0 ? '<h3>진행자와 기록자가 함께 지킬 사항</h3><ul class="rules">' + RULES.map(r => '<li>' + r + '</li>').join('') + '</ul>' : '') +
      TEMPLATE.map((s, ti) => {
        if (s.tab !== tab) return '';
        const head = '<h3>' + esc(s.head) + ' <small>— ' + esc(s.q) + '</small></h3>' + (s.guide ? '<p class="guide">' + esc(s.guide) + '</p>' : '');
        if (s.cols) {
          return head + '<table class="cols"><thead><tr><th>' + esc(s.head.slice(0, 1)) + '</th>' + s.cols.map(f => '<th>' + FIELDS[f].label + '</th>').join('') + '</tr></thead><tbody>' +
            '<tr class="exr"><td>예시</td>' + s.ex.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>' +
            Array.from({ length: s.people }, (_, r) => '<tr><td class="l">' + (r + 1) + '</td>' + s.cols.map((f, ci) => cellHtml('T' + ti + 'R' + r + 'C' + ci, s.head + ' 참여자 ' + (r + 1) + ' ' + FIELDS[f].label)).join('') + '</tr>').join('') + '</tbody></table>';
        }
        if (s.pair) {
          return head + '<table class="pair"><thead><tr><th>' + esc(s.head) + '</th>' + s.pair.map(([x, h]) => '<th>' + esc(x) + '<small>' + esc(h) + '</small></th>').join('') + '</tr></thead><tbody>' +
            s.groups.map(g => '<tr class="band ' + g.field + '"><td colspan="' + (1 + s.pair.length) + '"><b>' + esc(g.band) + '</b> <small>' + esc(g.desc) + '</small></td></tr>' +
              '<tr class="exr"><td>예시</td>' + g.ex.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>' +
              s.rows.map(([f, label], ri) => f !== g.field ? '' : '<tr class="g-' + f + '"><td class="l">' + esc(label) + '</td>' + s.pair.map((x, ci) => cellHtml('T' + ti + 'R' + ri + 'C' + ci, label + ' ' + x[0])).join('') + '</tr>').join('')).join('') + '</tbody></table>';
        }
        if (s.sel) {  // ③ 선정 과제·투표 결과: 제안 내용
          return head + '<table class="pair"><thead><tr><th>' + esc(s.head) + '</th>' + s.sel.map(([x, h]) => '<th>' + esc(x) + '<small>' + esc(h) + '</small></th>').join('') + '</tr></thead><tbody>' +
            '<tr class="exr"><td>예시</td>' + s.ex.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>' +
            s.rows.map(([f, label, desc], ri) => '<tr class="' + (f === 'pick' ? (/외부/.test(label) ? 'g-ext' : 'g-us') : '') + '"><td class="l">' + esc(label) + (desc ? '<small>' + esc(desc) + '</small>' : '') + '</td>' + s.sel.map((x, ci) => cellHtml('T' + ti + 'R' + ri + 'C' + ci, label + ' ' + x[0])).join('') + '</tr>').join('') + '</tbody></table>';
        }
        return head + '<table><thead><tr><th>' + esc(s.head) + '</th><th>예시 (이렇게 쓰면 돼요)</th><th>우리 테이블 답 ✍️</th></tr></thead><tbody>' +
          s.rows.map(([f, label, desc, ex], ri) => '<tr><td class="l" data-ex="' + esc(ex ? '예) ' + ex : '') + '">' + esc(label) + (desc ? '<small>' + esc(desc) + '</small>' : '') + '</td><td class="ex">' + esc(ex) + '</td>' + cellHtml('T' + ti + 'R' + ri, s.head + ' ' + label) + '</tr>').join('') + '</tbody></table>';
      }).join('');
    document.querySelectorAll('textarea').forEach(grow);
  }
  const cellHtml = (k, aria) => '<td class="ans"><textarea data-k="' + k + '" rows="2" aria-label="' + esc(aria) + '">' + esc((cells[k] || []).join('\n')) + '</textarea><span class="h" data-h="' + k + '"></span></td>';
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(40, ta.scrollHeight) + 'px'; }
  function save() { A.LS.set('agora-practice-v3', { cells, table: tableNo }); }

  // 칸별 알림
  const PHONE = /01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/;
  const slotField = Object.fromEntries(SLOTS.map(x => [x.key, x]));
  function hint(k, lines) {
    const sl = slotField[k], all = lines.join(' ');
    if (PHONE.test(all)) return ['bad', '전화번호는 쓰지 않아요. 지워 주세요.'];
    if (lines.some(l => l.length > 60)) return ['warn', '한 줄이 길어요. 엔터로 나누거나 짧게 써 주세요.'];
    if (sl.field === 'done' && lines.length && !/제출/.test(all)) return ['warn', '모두 동의하면 ‘제출’이라고 써요.'];
    if (A.TASK_FIELDS.includes(sl.field) && sl.task === 0 && !lines.length) return ['', '못 정하면 ‘추후 협의’'];
    if (sl.col != null && sl.field !== 'tally' && lines.length > 1) return ['warn', '한 줄에 제안 하나. 다음 제안은 아래 줄에 써요.'];
    if (lines.length > 1) return ['ok', '카드 ' + lines.length + '장으로 올라가요'];
    return ['', ''];
  }

  // 화면 미리보기 (실제 스크린과 같은 파서)
  function render() {
    const items = A.parseDoc(A.rowsFromCells(cells)).map((it, i) => Object.assign({ table: tableNo, id: it.slot + '|' + it.text + '|' + i }, it));
    const t = A.tableByNo(tableNo);
    $('#scr').style.setProperty('--c', TOPICS[t.topic].color);
    const card = it => '<div class="cd' + (seen.has(it.id) ? '' : ' new') + '">' + esc(it.text) + '</div>';
    const of = f => items.filter(i => i.field === f);
    const d = A.tableData(items, tableNo);
    const kind = k => k === 'us' ? '<span class="kind us">주민실천</span>' : k === 'ext' ? '<span class="kind ext">외부협력</span>' : '';
    let html = '<div class="q">“' + esc(SUBSTEPS[step].q) + '”<small>' + TOPICS[t.topic].name + ' · 테이블 ' + t.no + '</small></div>';
    if (step === 0) html += '<div class="cols c3">' + [['good', '😊 좋았던 점', '#34d399'], ['bad', '😣 불편한 점', '#f87171'], ['better', '💡 개선점', '#fbbf24']].map(([f, l, k]) => '<div><div class="colh" style="--k:' + k + '">' + l + '</div>' + (of(f).map(card).join('') || '<p class="none">아직 없음</p>') + '</div>').join('') + '</div>';
    if (step === 1) html += '<div class="cols c2">' + [['us', '🟢 [주민실천]', '#34d399'], ['ext', '🔵 [외부협력]', '#60a5fa']].map(([f, l, k]) => '<div><div class="colh" style="--k:' + k + '">' + l + '</div>' + (of(f).map(card).join('') || '<p class="none">아직 없음</p>') + '</div>').join('') + '</div>';
    if (step === 2) html += (d.picks.map(p => '<div class="pick"><i>★</i>' + esc(p.text) + kind(p.kind) + '</div>').join('') || '<p class="none">선정 과제를 쓰면 ★로 떠요</p>') +
      (d.tally.length ? '<p class="none" style="margin:6px 0">🗳 ' + esc(d.tally.map(i => i.text).join(' ')) + '</p>' : '') +
      (d.rest.length ? '<p class="none" style="margin:8px 0 4px">선정되지 않은 의견</p>' + d.rest.map(r => '<div class="cd">' + esc(r.text) + kind(r.kind) + '</div>').join('') : '');
    if (step === 3) { const ks = [0, 1].filter(i => i === 0 || d.picks[1] || A.filled(d.tasks[1])); html += ks.map(i => '<div class="pick"><i>★</i>' + (ks.length > 1 ? '과제 ' + (i + 1) + ' · ' : '') + esc(d.picks[i] ? d.picks[i].text : '선정 과제') + '</div><dl class="f5">' +
      TASK_FIELDS.map(f => '<div class="' + (d.tasks[i][f] ? '' : 'off') + '"><dt>' + FIELDS[f].label + '</dt><dd>' + (esc(d.tasks[i][f]) || '…') + '</dd></div>').join('') + '</dl>').join('<br>'); }
    if (step === 4) {
      const ps = A.proposals(tableNo, items, null, false);
      html += '<div class="sheet">' + (d.done ? '<span class="done">✓ 제출</span>' : '') + '<b class="t">테이블 ' + t.no + ' · 의제 제안서</b>' +
        (ps.map(p => '<div class="pick" style="margin-top:10px"><i>★</i>' + esc(p.title) + kind(p.kind) + '</div><dl class="f5">' + TASK_FIELDS.map(f => '<div class="' + (p[f] ? '' : 'off') + '"><dt>' + FIELDS[f].label + '</dt><dd>' + (esc(p[f]) || '추후 협의') + '</dd></div>').join('') + '</dl>').join('') || '<p class="none">④를 채우면 제안서가 돼요</p>') +
        '<p class="none" style="margin-top:10px">관제반이 AI로 문장을 다듬으면 ✨ 표시와 함께 짧고 분명한 문장으로 바뀌어요.</p></div>';
    }
    $('#scr').innerHTML = html;
    items.forEach(it => seen.add(it.id));
    document.querySelectorAll('[data-h]').forEach(el => { const [c, m] = hint(el.dataset.h, cells[el.dataset.h] || []); el.className = 'h ' + c; el.textContent = m; });

    const has = (f, k) => linesOf(f, k).length > 0;
    const M = [
      ['① 참여자 두 명 이상의 이야기를 각자 줄에', new Set(['good', 'bad', 'better'].flatMap(f => SLOTS.filter(x => x.field === f && (cells[x.key] || []).length).map(x => x.key.replace(/C\d+$/, '')))).size >= 2],
      ['② [주민실천] 두 칸 이상 + [외부협력] 한 칸 이상', new Set(slotsOf('us').filter(k => (cells[k] || []).length).map(k => k.replace(/C\d+$/, ''))).size >= 2 && has('ext')],
      ['③ 선정 과제 🟢 주민·🔵 외부를 ②의 제안 내용 그대로', SLOTS.filter(x => x.field === 'pick' && (cells[x.key] || []).length).length >= 2],
      ['④ 과제 1의 다섯 칸 모두 (못 정하면 ‘추후 협의’)', TASK_FIELDS.every(f => has(f, 0))],
      ['④ 맨 아래 「최종 제출」에 ‘제출’', /제출/.test(linesOf('done').join(' '))]
    ];
    $('#missions').innerHTML = M.map(([l, ok]) => '<li class="' + (ok ? 'ok' : '') + '"><i>' + (ok ? '✓' : '') + '</i>' + l + '</li>').join('');
    const n = M.filter(m => m[1]).length;
    $('#score').textContent = n === M.length ? '🎉 모두 완료!' : n + ' / ' + M.length;
  }

  $('#steps').innerHTML = SUBSTEPS.map((s, i) => '<button data-i="' + i + '">' + s.label[0] + '</button>').join('');
  // 문서 탭과 화면 단계는 함께 움직임
  // 문서 탭(📌, ①~⑤)과 화면 단계(①~⑤)는 함께 움직임
  let tabIdx = 1;
  function setTab(i) {
    if (i === 'docs') { tabIdx = i; document.querySelectorAll('#dtabs button').forEach(b => b.classList.toggle('on', b.dataset.i === 'docs')); buildDocs(); return; }
    tabIdx = i; step = Math.min(Math.max(i - 1, 0), 4); document.querySelectorAll('#steps button').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === step)); buildPaper(); render(); }
  const setStep = i => setTab(i + 1);
  $('#steps').onclick = e => { const b = e.target.closest('button'); if (b) setStep(Number(b.dataset.i)); };
  $('#dtabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.i === 'docs' ? 'docs' : Number(b.dataset.i)); };

  $('#paper').addEventListener('input', e => {
    const ta = e.target.closest('textarea'); if (!ta) return;
    grow(ta);
    cells[ta.dataset.k] = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
    save(); render();
  });
  $('#table').onchange = e => { tableNo = Number(e.target.value); save(); buildPaper(); render(); };
  $('#clear').onclick = () => { if (!confirm('연습 내용을 모두 지울까요?')) return; cells = {}; seen = new Set(); save(); buildPaper(); render(); };
  $('#fill').onclick = () => {
    cells = {};
    TEMPLATE.forEach((s, ti) => {
      if (s.cols) { s.cols.forEach((f, ci) => { cells['T' + ti + 'R0C' + ci] = [s.ex[ci]]; }); cells['T' + ti + 'R1C0'] = ['아이들과 주말마다 산책해요']; cells['T' + ti + 'R1C1'] = ['비 오면 길이 미끄러워요']; }
      else if (s.pair) s.groups.forEach(g => { const ri = s.rows.findIndex(r => r[0] === g.field); g.ex.forEach((x, ci) => { cells['T' + ti + 'R' + ri + 'C' + ci] = [x]; }); });
      else if (s.sel) { cells['T' + ti + 'R0C0'] = [s.ex[0]]; cells['T' + ti + 'R2C0'] = ['10명 투표 · 1위 1번 7표 → 선정 과제 자동 기록', '1번 두 동 함께 걷기 — 7표', '2번 사진 기록단 — 3표']; }
      else s.rows.forEach(([, , , ex], ri) => { if (ex) cells['T' + ti + 'R' + ri] = [ex]; });
    });
    const us = slotsOf('us'); cells[us[1]] = ['산책로 변화를 사진으로 남기는 사진 기록단 만들기'];
    save(); buildPaper(); render();
  };

  setTab(1);
})();
</script>
</body>
</html>
