<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>영상 갤러리 · 꽃대어른학교</title>
<link rel="stylesheet" href="../gallery.css">
<style>
  .vgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .vgrid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
  @media (min-width: 960px) { .vgrid { grid-template-columns: repeat(5, 1fr); } }
  .vcard { position: relative; display: block; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--line); box-shadow: 0 1px 3px rgba(122, 82, 53, .15); }
  .vcard.wide { grid-column: span 2; aspect-ratio: 16 / 9; }
  .vcard img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vcard .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .vcard .play span { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .88); display: grid; place-items: center; color: var(--orange-deep); font-size: 22px; padding-left: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  .vcard .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; background: linear-gradient(transparent, rgba(30, 20, 12, .78)); color: #fff; font-size: 12px; font-weight: 700; text-align: left; line-height: 1.3; }
  .player { position: fixed; inset: 0; z-index: 50; background: #17110c; display: flex; flex-direction: column; }
  .player[hidden] { display: none; }
  .player .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 6px; }
  .player video { max-width: 100%; max-height: 100%; background: #000; border-radius: 8px; }
  .player .ctrls { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .player .ctrls button { flex: 1; padding: 13px 0; border-radius: 12px; background: #3a2b20; color: #f5e9da; font-weight: 700; font-size: 16px; }
  .player .ctrls button:disabled { opacity: .35; }
</style>
</head>
<body>
<header class="hero">
  <p class="eyebrow">2026 북평데이 · 꽃대어른학교 AI 크리에이터 과정</p>
  <h1>수강생 영상 작품<br>갤러리</h1>
  <p class="lead">수강생들이 AI로 직접 만든 영상이에요.<br>영상을 누르면 소리와 함께 재생돼요.</p>
</header>
<nav class="chips" id="chips"></nav>
<main id="main"></main>
<footer class="foot">
  <a class="cross" href="../cardnews/">🖼 카드뉴스 · 정보 자료 보러 가기</a>
  <p>꽃대어른학교 AI 크리에이터 과정 · 북구평생학습관</p>
</footer>

<div class="player" id="player" hidden>
  <div class="lb-bar">
    <span id="pTitle"></span>
    <button type="button" id="pClose" aria-label="닫기">✕</button>
  </div>
  <div class="stage"><video id="pVideo" controls playsinline preload="auto"></video></div>
  <div class="ctrls">
    <button type="button" id="pPrev">‹ 이전 영상</button>
    <button type="button" id="pNext">다음 영상 ›</button>
  </div>
</div>

<script>
const player = document.getElementById("player"), video = document.getElementById("pVideo"), pTitle = document.getElementById("pTitle");
let queue = [], pos = 0;

function show(i) {
  pos = i;
  const it = queue[i];
  video.poster = it.poster;
  video.src = it.src;
  video.play().catch(() => {});
  pTitle.textContent = `${it.label} · ${i + 1} / ${queue.length}`;
  document.getElementById("pPrev").disabled = i === 0;
  document.getElementById("pNext").disabled = i === queue.length - 1;
}
function openPlayer(list, i) {
  queue = list;
  player.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ p: 1 }, "");
  show(i);
}
function closePlayer() {
  video.pause();
  video.removeAttribute("src");
  video.load();
  player.hidden = true;
  document.body.style.overflow = "";
}
document.getElementById("pClose").onclick = () => history.back();
document.getElementById("pPrev").onclick = () => pos > 0 && show(pos - 1);
document.getElementById("pNext").onclick = () => pos < queue.length - 1 && show(pos + 1);
video.addEventListener("ended", () => { if (pos < queue.length - 1) show(pos + 1); });
window.addEventListener("popstate", () => { if (!player.hidden) closePlayer(); });

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

fetch("data.json").then(r => r.json()).then(data => {
  const chips = document.getElementById("chips"), main = document.getElementById("main");
  data.forEach((s, si) => {
    const id = "s" + si;
    chips.insertAdjacentHTML("beforeend", `<a href="#${id}">${s.key}</a>`);
    const list = s.items.map((it, i) => ({ ...it, label: `${s.key} ${s.title}` }));
    const sec = document.createElement("section");
    sec.id = id;
    sec.innerHTML = `
      <div class="sec-head"><span class="tag">${s.key}</span><h2>${s.title}</h2><p>${s.desc}</p></div>
      <div class="vgrid">${s.items.map((it, i) => `
        <button type="button" class="vcard${it.vert ? "" : " wide"}" data-i="${i}">
          <img src="${it.poster}" alt="" loading="lazy">
          <span class="play"><span>▶</span></span>
          <span class="meta">${it.title ? it.title + " · " : ""}${fmt(it.dur)}</span>
        </button>`).join("")}</div>`;
    sec.addEventListener("click", e => {
      const b = e.target.closest("button.vcard");
      if (b) openPlayer(list, +b.dataset.i);
    });
    main.appendChild(sec);
  });
});
</script>
</body>
</html>
