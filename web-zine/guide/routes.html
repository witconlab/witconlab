    r.m = (P[i] && P[i].m) || 0;
    lines.push(L.polyline(path, { color: r.c, weight: 7, opacity: .9, lineJoin: 'round' }).addTo(map)
      .on('click', function () { pick(i + 1); }));
    stopLayers.push(L.layerGroup(r.stops.map(function (s) {
      return L.marker([s[0], s[1]], { icon: L.divIcon({ className: '', html: '<div class="pin" style="border-color:' + r.c + '">' + (i + 1) + '</div>', iconSize: [26, 26] }) })
        .bindTooltip(s[2], { permanent: true, direction: s[3] || 'right', offset: [s[3] === 'left' ? -14 : 14, 0], className: 'lbl' });
    })));
  });
  L.marker(HOME, { zIndexOffset: 1000, icon: L.divIcon({ className: '', html: '<div class="pin home">★</div>', iconSize: [34, 34] }) })
    .bindTooltip('출발·도착 · 신흥동행정복지센터', { permanent: true, direction: 'top', offset: [0, -18], className: 'lbl' }).addTo(map);

  var btns = [];
  ['전체'].concat(ROUTES.map(function (r, i) { return String(i + 1); })).forEach(function (t, k) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    if (k) { b.style.setProperty('--c', ROUTES[k - 1].c); b.setAttribute('aria-label', k + '번 길 · ' + ROUTES[k - 1].name); }
    b.addEventListener('click', function () { pick(k); });
    tabs.appendChild(b); btns.push(b);
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pick(k) {
    cur = k;
    btns.forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === k)); });
    lines.forEach(function (l, j) {
      var on = !k || j === k - 1;
      l.setStyle({ opacity: on ? .95 : .15, weight: on && k ? 9 : 7 });
      if (on) l.bringToFront();
      if (on && k) stopLayers[j].addTo(map); else stopLayers[j].remove(); // 전체 보기에선 이름표를 감춰 겹치지 않게
    });
    if (!k) {
      card.innerHTML = '<p class="kick mono">WALK · 5 ROUTES</p><h2>테이블마다<br>한 길씩 걸어요.</h2>' +
        '<ul class="all-list">' + ROUTES.map(function (r, i) {
          return '<li data-k="' + (i + 1) + '" style="--c:' + r.c + '"><b>' + (i + 1) + '</b>' + esc(r.name) + '<small>' + (r.m / 1000).toFixed(1) + 'km · ' + walkMin(r.m) + '분</small></li>';
        }).join('') + '</ul><p class="say hand">40분 안에 돌아와요. 걷는 시간 + 멈춰서 기록하는 시간.</p>';
      card.querySelectorAll('li').forEach(function (li) { li.addEventListener('click', function () { pick(+li.dataset.k); }); });
      map.fitBounds(L.featureGroup(lines).getBounds(), { padding: [30, 30] });
    } else {
      var r = ROUTES[k - 1];
      card.style.setProperty('--c', r.c);
      card.innerHTML = '<p class="kick mono">ROUTE 0' + k + ' · ' + k + '번 테이블</p>' +
        '<h2><i>' + k + '</i>' + esc(r.name) + '</h2>' +
        '<p class="facts"><span>왕복 ' + (r.m / 1000).toFixed(1) + 'km</span><span>걷기 약 ' + walkMin(r.m) + '분</span><span' + (/큰길|오르막/.test(r.level) ? ' class="warn"' : '') + '>' + esc(r.level) + '</span></p>' +
        '<dl><dt>이런 분께</dt><dd>' + esc(r.who) + '</dd><dt>길</dt><dd>' + esc(r.way) + '</dd><dt>잘 맞는 기록</dt><dd>' + esc(r.rec) + '</dd><dt>조심해요</dt><dd>' + esc(r.care) + '</dd></dl>' +
        '<p class="say hand">? ' + esc(r.ask) + '</p>';
      map.fitBounds(lines[k - 1].getBounds(), { padding: [60, 60], maxZoom: 18 });
    }
    history.replaceState(null, '', '#' + k);
  }

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^[0-5]$/.test(e.key)) pick(+e.key);
    else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });
  document.getElementById('full').addEventListener('click', function () {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
  });
  var cur = Math.max(0, Math.min(5, parseInt(location.hash.slice(1), 10) || 0));
  pick(cur);
  // 글꼴·격자 배치가 끝난 뒤 지도 크기가 바뀌므로, 크기가 바뀔 때마다 다시 맞춘다.
  if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); pick(cur); }).observe(document.getElementById('map'));
  window.addEventListener('load', function () { map.invalidateSize(); pick(cur); });
})();
</script>
</body>
</html>
