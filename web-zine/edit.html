<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 진 꾸미기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/zine.css">
</head>
<body class="dot-paper ed-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-5-4.5-8.5 8"/></symbol>
    <symbol id="i-sticker" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9h8M8 12.5h5"/></symbol>
    <symbol id="i-title" viewBox="0 0 24 24"><path d="M5 7V4.5h14V7M12 4.5V19M9 19h6"/><path d="M4 21h16" opacity=".45"/></symbol>
    <symbol id="i-bg" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.3 0 1.9-.8 1.9-1.7 0-1.3-1.1-1.7-1.1-2.7 0-.9.7-1.6 1.7-1.6h2.3A4.2 4.2 0 0021 10.8C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 13.5L4.5 9 9 4.5"/><path d="M4.5 9H14a5.5 5.5 0 010 11h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 13.5L19.5 9 15 4.5"/><path d="M19.5 9H10a5.5 5.5 0 000 11h3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><rect x="8" y="3.5" width="12.5" height="12.5" rx="2"/><path d="M15.5 16v2.5a2 2 0 01-2 2H5.5a2 2 0 01-2-2v-8a2 2 0 012-2H8" opacity=".45"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><rect x="3.5" y="8" width="12.5" height="12.5" rx="2" opacity=".45"/><path d="M8 8V5.5a2 2 0 012-2h8.5a2 2 0 012 2V14a2 2 0 01-2 2H16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2h3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.5 6.5l1 13.5h9l1-13.5M10.5 10.5v6M13.5 10.5v6"/></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="1.5"/><rect x="7" y="5.5" width="10" height="10"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4.5V11h-6.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs>
</svg>

<div class="ed" id="app">
  <header class="ed-top">
    <a class="ed-back" id="backLink" href="view.html" aria-label="내 진 보기로 돌아가기">← 내 진</a>
    <b class="ed-pagename hand" id="pageName"></b>
    <button class="ed-who" id="whoBtn" type="button" title="다른 이름으로 들어가기"></button>
    <button class="badge ed-badge" id="badge" type="button" data-state="saved">저장됨</button>
  </header>

  <div class="ed-banner" id="stale" role="status" hidden>
    <span>이전에 저장되지 않은 작업이 있어요</span>
    <button type="button" class="ed-mini" id="staleLoad">불러오기</button>
    <button type="button" class="ed-mini ed-mini-ghost" id="staleDrop">버리기</button>
  </div>

  <nav class="ed-thumbs" id="thumbs" aria-label="쪽 고르기"></nav>

  <main class="ed-stage" id="stage">
    <div class="ed-stage-inner" id="stageInner"></div>
    <div class="ed-chips">
      <span class="ed-chip" id="uploadChip" hidden></span>
      <span class="ed-chip ed-chip-warn" id="outChip" hidden>가장자리는 잘릴 수 있어요</span>
    </div>
  </main>

  <div class="ed-ctx" id="ctxbar">
    <p class="ed-hint" id="ctxHint">요소를 누르면 옮기고 키울 수 있어요</p>
    <div class="ed-ctx-btns" id="ctxBtns" hidden>
      <button type="button" data-act="forward"><svg><use href="#i-up"/></svg>앞으로</button>
      <button type="button" data-act="backward"><svg><use href="#i-down"/></svg>뒤로</button>
      <button type="button" data-act="duplicate"><svg><use href="#i-copy"/></svg>복제</button>
      <button type="button" data-act="frame"><svg><use href="#i-frame"/></svg><span>폴라로이드 틀</span></button>
      <button type="button" data-act="edit"><svg><use href="#i-edit"/></svg>고치기</button>
      <button type="button" data-act="retry"><svg><use href="#i-retry"/></svg>다시 올리기</button>
      <button type="button" data-act="delete" class="danger"><svg><use href="#i-trash"/></svg>삭제</button>
    </div>
  </div>

  <nav class="ed-tools" aria-label="도구">
    <button type="button" data-tool="photo"><svg><use href="#i-photo"/></svg>사진</button>
    <button type="button" data-tool="sticker"><svg><use href="#i-sticker"/></svg>스티커</button>
    <button type="button" data-tool="text"><svg><use href="#i-text"/></svg>자막</button>
    <button type="button" data-tool="title"><svg><use href="#i-title"/></svg>제목</button>
    <button type="button" data-tool="bg"><svg><use href="#i-bg"/></svg>배경</button>
    <span class="ed-tools-sep" aria-hidden="true"></span>
    <button type="button" id="undo" aria-label="되돌리기" disabled><svg><use href="#i-undo"/></svg>되돌리기</button>
    <button type="button" id="redo" aria-label="다시하기" disabled><svg><use href="#i-redo"/></svg>다시하기</button>
  </nav>
</div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>

<div class="ed-backdrop" id="backdrop" hidden></div>

<section class="sheet ed-sheet ed-sheet-tall" id="sheet-sticker" aria-label="스티커" inert>
  <div class="sheet-head"><h2 class="hand">스티커</h2><button type="button" class="sheet-x" data-close aria-label="닫기"><svg><use href="#i-close"/></svg></button></div>
  <div class="stk-tabs" id="stkTabs" role="tablist"></div>
  <div class="stk-grid" id="stkGrid"></div>
</section>

<section class="sheet ed-sheet" id="sheet-text" aria-label="자막" inert>
  <div class="sheet-head"><h2 class="hand" id="textHead">자막 넣기</h2><button type="button" class="sheet-x" data-close aria-label="닫기"><svg><use href="#i-close"/></svg></button></div>
  <textarea class="input ed-textarea hand" id="textInput" rows="3" maxlength="200" placeholder="사진에 대한 이야기를 적어 보세요"></textarea>
  <div class="ed-row"><span class="ed-label">크기</span>
    <div class="seg" id="textSize">
      <button type="button" data-size="0.04">작게</button><button type="button" data-size="0.055">보통</button><button type="button" data-size="0.075">크게</button>
    </div>
  </div>
  <div class="ed-row"><span class="ed-label">색</span><div class="swatches" id="textColor"></div></div>
  <button type="button" class="btn btn-primary btn-block" id="textOk">넣기</button>
</section>

<section class="sheet ed-sheet" id="sheet-title" aria-label="제목" inert>
  <div class="sheet-head"><h2 class="hand">쪽 제목</h2><button type="button" class="sheet-x" data-close aria-label="닫기"><svg><use href="#i-close"/></svg></button></div>
  <input class="input hand ed-title-input" id="titleInput" type="text" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="이 쪽의 제목 (20자까지)">
  <div class="ed-row"><span class="ed-label">형광펜</span><div class="swatches" id="titleHl"></div></div>
  <p class="ed-note">제목은 쪽 위에서 끌어서 옮길 수 있어요.</p>
  <div class="ed-row2">
    <button type="button" class="btn" id="titleClear">지우기</button>
    <button type="button" class="btn btn-primary" id="titleOk">확인</button>
  </div>
</section>

<section class="sheet ed-sheet" id="sheet-bg" aria-label="배경" inert>
  <div class="sheet-head"><h2 class="hand">배경</h2><button type="button" class="sheet-x" data-close aria-label="닫기"><svg><use href="#i-close"/></svg></button></div>
  <div class="ed-row"><span class="ed-label">종이색</span><div class="swatches" id="bgPaper"></div></div>
  <div class="ed-row"><span class="ed-label">무늬</span>
    <div class="seg" id="bgPattern"><button type="button" data-pattern="dots">점</button><button type="button" data-pattern="grid">모눈</button><button type="button" data-pattern="none">없음</button></div>
  </div>
  <div class="ed-row"><span class="ed-label">테두리 선</span>
    <label class="switch"><input type="checkbox" id="bgFrame"><span></span></label>
  </div>
</section>

<div class="ed-toast" id="toast" role="status" hidden></div>
<div class="ed-loading" id="loading"><p class="hand">진을 펼치는 중…</p></div>

<script type="module" src="js/practice-banner.js"></script>
<script type="module" src="js/editor.js"></script>
</body>
</html>
