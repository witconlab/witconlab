<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원페이퍼 전체보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="css/plan.css">
<style>
  /* 슬라이드: 원페이퍼 한 장씩, 화면(빔프로젝터)에 맞게 크게 */
  body { background: var(--cream); }
  .sl-top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(246, 239, 220, .96); border-bottom: 2px solid var(--ink); }
  .sl-top a { color: var(--ink); font-weight: 700; font-size: 17px; }
  .sl-count { flex: 1 1 auto; text-align: center; font-size: 20px; font-weight: 800; }
  .sl-stage { max-width: 1100px; margin: 0 auto; padding: 8px 16px 120px; }
  .sl-stage .sheet { margin-top: 12px; font-size: clamp(17px, 1.5vw, 22px); }
  .sl-stage .sh-head h2 { font-size: clamp(28px, 3vw, 44px); }
  .sl-stage .sh-grid { grid-template-columns: 1fr 1fr; }
  .sl-stage .pf.wide { grid-column: 1 / -1; }
  @media (max-width: 640px) { .sl-stage .sh-grid { grid-template-columns: 1fr; } }
  .sl-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(246, 239, 220, .96); border-top: 2px solid var(--ink); }
  .sl-nav .bt { flex: 0 1 260px; }
  .sl-msg { margin: 40px auto; max-width: 520px; text-align: center; font-size: 21px; }
  :fullscreen .sl-top a, :fullscreen #full { display: none; }
</style>
</head>
<body>
<header class="sl-top">
  <a href="admin.html">← 관리자 화면</a>
  <span class="sl-count" id="count">원페이퍼</span>
  <button type="button" class="bt small" id="full">전체 화면</button>
</header>
<main class="sl-stage" id="stage" aria-live="polite"><p class="sl-msg">불러오는 중…</p></main>
<nav class="sl-nav" id="nav" hidden>
  <button type="button" class="bt" id="prev">‹ 이전</button>
  <button type="button" class="bt primary" id="next">다음 ›</button>
</nav>
<script type="module" src="js/plans-view.js"></script>
</body>
</html>
